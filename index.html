<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - Hands vs Balls</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-frame">
            <div class="game-content">
                <h1 class="game-title">Hands ✋ vs Balls 🏐</h1>
                <div class="game-info">
                    <div class="current-player">
                        <span>Current Player: </span>
                        <span id="player-indicator">✋</span>
                    </div>
                </div>
                <div class="board" id="game-board">
                    <div class="cell" data-index="0" data-number="1"><span class="cell-number">1</span></div>
                    <div class="cell" data-index="1" data-number="2"><span class="cell-number">2</span></div>
                    <div class="cell" data-index="2" data-number="3"><span class="cell-number">3</span></div>
                    <div class="cell" data-index="3" data-number="4"><span class="cell-number">4</span></div>
                    <div class="cell" data-index="4" data-number="5"><span class="cell-number">5</span></div>
                    <div class="cell" data-index="5" data-number="6"><span class="cell-number">6</span></div>
                    <div class="cell" data-index="6" data-number="7"><span class="cell-number">7</span></div>
                    <div class="cell" data-index="7" data-number="8"><span class="cell-number">8</span></div>
                    <div class="cell" data-index="8" data-number="9"><span class="cell-number">9</span></div>
                </div>
                <div class="game-status" id="game-status"></div>
                <button class="reset-btn" id="reset-btn">New Game</button>
            </div>
        </div>
        <div class="logo">
            <img src="Zain Logo.png" alt="Zain Logo">
        </div>
    </div>
    <div class="fullscreen-sting" id="fullscreen-sting">
        <button class="sting-reset-btn" id="sting-reset-btn">New Game</button>
        <div class="sting-content">
            <div class="sting-emoji" id="sting-emoji"></div>
            <div class="sting-message" id="sting-message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
